name: Links check

on:
  push:
    paths:
      - "**/*.md"
      - "tools/ci/check-links.mjs"
      - ".github/workflows/links-check.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "tools/ci/check-links.mjs"
      - ".github/workflows/links-check.yml"

permissions:
  contents: read

jobs:
  links-check:
    name: Relative Markdown links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check relative Markdown links
        run: node tools/ci/check-links.mjs
